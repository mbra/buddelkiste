[project]
name = "buddelkiste"
version = "0.1.0"
description = "Run a command inside a bubblewrap sandbox"
readme = "README.md"
authors = [
    { name = "Michael van Bracht", email = "michael@wontfix.org" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.scripts]
bk = "buddelkiste.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buddelkiste"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
markers = [
    "integration: nested-safe integration tests (real bwrap / nested nft)",
    "requires_nested_net: needs unshare --user --map-root-user --net",
    "requires_nested_user: needs unshare --user --map-root-user",
    "requires_tun: needs /dev/net/tun and filter-mode helpers",
    "requires_outbound: needs outbound TCP to 1.1.1.1:443",
]
