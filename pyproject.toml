[project]
name = "buddelkiste"
version = "0.2.0"
description = "Run a command inside a bubblewrap sandbox"
readme = "README.md"
authors = [
    { name = "Michael van Bracht", email = "michael@wontfix.org" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.scripts]
bk = "buddelkiste.cli:cli"

[project.entry-points."buddelkiste.features"]
asdf = "buddelkiste.features:ASDF"
cursor = "buddelkiste.features:CURSOR"
dbus = "buddelkiste.features:DBUS"
docker = "buddelkiste.features:DOCKER"
docker-proxy = "buddelkiste.features:DOCKER_PROXY"
git = "buddelkiste.features:GIT"
google = "buddelkiste.features:GOOGLE"
gui = "buddelkiste.features:GUI"
java = "buddelkiste.features:JAVA"
locale = "buddelkiste.features:LOCALE"
node = "buddelkiste.features:NODE"
nvim = "buddelkiste.features:NVIM"
python = "buddelkiste.features:PYTHON"
rust = "buddelkiste.features:RUST"
ssh = "buddelkiste.features:SSH"
term = "buddelkiste.features:TERM"
user = "buddelkiste.features:USER"
xdg-open = "buddelkiste.features:XDG_OPEN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buddelkiste"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    # Enable pytest-cov; measured packages come from [tool.coverage.run] only.
    # Passing --cov=buddelkiste *and* source_pkgs = ["buddelkiste"] duplicates the
    # source list and triggers a spurious module-not-measured warning.
    "--cov",
    "--cov-report=term",
]
markers = [
    "integration: nested-safe integration tests (real bwrap / nested nft)",
    "requires_nested_net: needs unshare --user --map-root-user --net",
    "requires_nested_user: needs unshare --user --map-root-user",
    "requires_tun: needs /dev/net/tun and filter-mode helpers",
    "requires_outbound: needs outbound TCP to 1.1.1.1:443",
    "requires_docker: needs host Docker daemon; skipped inside bwrap sandboxes",
]

[tool.coverage.run]
branch = true
source_pkgs = ["buddelkiste"]
relative_files = true

[tool.coverage.report]
show_missing = false
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
ignore = ["E501"]
