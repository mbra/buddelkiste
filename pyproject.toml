[project]
name = "buddelkiste"
version = "0.1.0"
description = "Run a command inside a bubblewrap sandbox"
readme = "README.md"
authors = [
    { name = "Michael van Bracht", email = "michael@wontfix.org" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.scripts]
bk = "buddelkiste.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buddelkiste"]
